name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WABT_VERSION: 1.0.42
      WABT_SHA256: 84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install WABT
        run: |
          archive="wabt-${WABT_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/${archive}"
          echo "${WABT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive"
          echo "$PWD/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          lua -v
          wat2wasm --version
          wast2json --help | grep --fixed-strings --quiet -- '--enable-wide-arithmetic'
      - name: Run tests
        run: make test
