name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Lua and WABT
        run: sudo apt-get update && sudo apt-get install -y lua5.4 wabt
      - name: Run tests
        run: make test
